<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layanan Kelurahan Digital</title>
    <script src="https://tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans antialiased">

    <!-- Header Aplikasi -->
    <header class="bg-blue-700 text-white p-4 shadow-md sticky top-0 z-10">
        <div class="max-w-md mx-auto flex items-center justify-between">
            <div>
                <h1 class="text-lg font-bold">E-Kelurahan Mandiri</h1>
                <p class="text-xs text-blue-200">Pelayanan Publik Cepat & Gratis</p>
            </div>
            <span class="bg-green-500 text-xs font-semibold px-2.5 py-1 rounded-full">Online</span>
        </div>
    </header>

    <!-- Konten Utama -->
    <main class="max-w-md mx-auto p-4 pb-20">
        
        <!-- Kartu Informasi -->
        <div class="bg-white rounded-xl p-4 shadow-sm mb-4 border-l-4 border-blue-600">
            <h2 class="font-semibold text-gray-800 text-sm">Selamat Datang, Warga!</h2>
            <p class="text-xs text-gray-600 mt-1">Ajukan surat keterangan dari rumah. Siapkan foto KTP, KK, dan Pengantar RT/RW sebelum mengisi formulir.</p>
        </div>

        <!-- Formulir Pengajuan -->
        <form id="formLayanan" class="bg-white rounded-xl p-5 shadow-sm space-y-4">
            <h3 class="font-bold text-gray-800 border-b pb-2">Formulir Pengajuan Surat</h3>

            <div>
                <label class="block text-xs font-medium text-gray-700 mb-1">Jenis Layanan Surat</label>
                <select id="jenisSurat" required class="w-full border border-gray-300 rounded-lg p-2.5 text-sm bg-gray-50 focus:ring-blue-500 focus:border-blue-500">
                    <option value="">-- Pilih Jenis Surat --</option>
                    <option value="Surat Keterangan Domisili">Surat Keterangan Domisili</option>
                    <option value="Surat Keterangan Usaha (SKU)">Surat Keterangan Usaha (SKU)</option>
                    <option value="Surat Keterangan Tidak Mampu (SKTM)">Surat Keterangan Tidak Mampu (SKTM)</option>
                    <option value="Surat Pengantar KTP / KK">Surat Pengantar KTP / KK</option>
                    <option value="Surat Keterangan Kelahiran / Kematian">Surat Keterangan Kelahiran / Kematian</option>
                </select>
            </div>

            <div>
                <label class="block text-xs font-medium text-gray-700 mb-1">NIK (16 Digit)</label>
                <input type="number" id="nik" placeholder="Contoh: 3374012345678901" required class="w-full border border-gray-300 rounded-lg p-2.5 text-sm">
            </div>

            <div>
                <label class="block text-xs font-medium text-gray-700 mb-1">Nama Lengkap (Sesuai KTP)</label>
                <input type="text" id="nama" placeholder="Masukkan nama lengkap" required class="w-full border border-gray-300 rounded-lg p-2.5 text-sm">
            </div>

            <div>
                <label class="block text-xs font-medium text-gray-700 mb-1">RT / RW</label>
                <input type="text" id="rtrw" placeholder="Contoh: RT 02 / RW 05" required class="w-full border border-gray-300 rounded-lg p-2.5 text-sm">
            </div>

            <div>
                <label class="block text-xs font-medium text-gray-700 mb-1">Keperluan</label>
                <textarea id="keperluan" rows="2" placeholder="Jelaskan keperluan pembuatan surat..." required class="w-full border border-gray-300 rounded-lg p-2.5 text-sm"></textarea>
            </div>

            <button type="submit" class="w-full bg-blue-700 hover:bg-blue-800 text-white font-semibold py-3 rounded-lg text-sm shadow transition">
                Kirim Pengajuan via WhatsApp
            </button>
        </form>
    </main>

    <!-- Navigasi Bawah Ala Aplikasi Android -->
    <nav class="fixed bottom-0 w-full bg-white border-t border-gray-200 py-2">
        <div class="max-w-md mx-auto flex justify-around text-xs text-gray-600">
            <button class="flex flex-col items-center text-blue-700 font-semibold">
                <span>📝 Ajukan</span>
            </button>
            <button onclick="alert('Fitur Cek Status terhubung ke database kelurahan.')" class="flex flex-col items-center">
                <span>🔍 Cek Status</span>
            </button>
            <button onclick="alert('Jam Operasional: Senin - Jumat, 08.00 - 15.00 WIB')" class="flex flex-col items-center">
                <span>ℹ️ Info Kantor</span>
            </button>
        </div>
    </nav>

    <script>
        document.getElementById('formLayanan').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Ganti dengan nomor WhatsApp Admin Kelurahan (format 628...)
            const nomorAdmin = "6281234567890"; 
            
            const jenis = document.getElementById('jenisSurat').value;
            const nik = document.getElementById('nik').value;
            const nama = document.getElementById('nama').value;
            const rtrw = document.getElementById('rtrw').value;
            const keperluan = document.getElementById('keperluan').value;

            const pesan = `Halo Admin Kelurahan, saya ingin mengajukan surat:\n\n` +
                          `*Jenis Surat:* ${jenis}\n` +
                          `*NIK:* ${nik}\n` +
                          `*Nama:* ${nama}\n` +
                          `*Alamat:* ${rtrw}\n` +
                          `*Keperluan:* ${keperluan}\n\n` +
                          `_Berikut saya lampirkan foto KTP, KK, dan Pengantar RT/RW._`;

            const urlWA = `https://wa.me{nomorAdmin}?text=${encodeURIComponent(pesan)}`;
            window.open(urlWA, '_blank');
        });
    </script>
</body>
</html>
